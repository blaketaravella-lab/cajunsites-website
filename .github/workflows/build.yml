name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Worker JavaScript
        run: |
          set -e
          find worker -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Test Visual Family Engine
        run: node worker/visual-family-engine.test.mjs
      - name: Test Platform Invariants
        run: node worker/platform-invariants.test.mjs
      - name: Test Mobile Responsiveness Invariants
        run: node worker/mobile-invariants.test.mjs
      - name: Test Prospect Enrichment Invariants
        run: node worker/prospect-enrichment.test.mjs
      - name: Test AI Image Pipeline Invariants
        run: node worker/image-pipeline.test.mjs
      - name: Build Astro site
        run: npm run build
